services:
  postgres:
    image: postgres:16-alpine
    container_name: sisconf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sisconf
      POSTGRES_PASSWORD: sisconf_dev
      POSTGRES_DB: sisconf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisconf -d sisconf"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sisconf-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@sisconf.dev
      PGADMIN_DEFAULT_PASSWORD: sisconf_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
